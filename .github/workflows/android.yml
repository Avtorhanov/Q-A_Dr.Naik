# Собирает APK при каждом изменении приложения или базы и выкладывает его в раздел Releases.
# Скачать с телефона: страница репозитория -> Releases -> последний выпуск -> zakir-naik-qa.apk
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "search.js"
      - "app.js"
      - "data/**"
      - "icons/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Проверка базы и поиска
        run: |
          python3 tools/validate.py
          node tests/search.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Сборка APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
        run: gradle --no-daemon assembleDebug

      - name: Имя файла
        run: cp android/app/build/outputs/apk/debug/app-debug.apk zakir-naik-qa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zakir-naik-qa-apk
          path: zakir-naik-qa.apk

      - name: Выпуск в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Вопрос — ответ 2.0.${{ github.run_number }}
          body: |
            Демонстрационная сборка для Android 7.0 и новее. Скачайте файл zakir-naik-qa.apk и откройте его на телефоне.
            Сборка подписана демонстрационным ключом из репозитория и не предназначена для магазинов приложений.
          files: zakir-naik-qa.apk
